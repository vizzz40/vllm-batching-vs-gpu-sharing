# Prometheus + Grafana for watching vLLM during k6 runs.
# vLLM itself runs separately (docker run ... -p 8000:8000), see the README.
services:
  prometheus:
    image: prom/prometheus:v3.15.1
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets the container reach ports published on the host (vLLM on :8000)
    ports:
      - "127.0.0.1:9090:9090" # bound to localhost only: not reachable from the network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus # keep scraped data across container restarts

  grafana:
    image: grafana/grafana:13.2.4
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # local lab only: no login screen
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin # anonymous visitors can edit dashboards
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - grafana-data:/var/lib/grafana # keep dashboards across restarts

volumes:
  prometheus-data:
  grafana-data:
